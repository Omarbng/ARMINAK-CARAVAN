<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Grain terminal and bulk vessel at golden hour">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8DDCB"/>
      <stop offset="0.45" stop-color="#EFE0C6"/>
      <stop offset="1" stop-color="#EBD3AC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.63" r="0.55">
      <stop offset="0" stop-color="#F6DFB2" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#EFD3A2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EFD3A2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3BE9C"/>
      <stop offset="0.35" stop-color="#C2AC8B"/>
      <stop offset="1" stop-color="#A08A6B"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE0C6" stop-opacity="0"/>
      <stop offset="1" stop-color="#EFE0C6" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <ellipse cx="820" cy="424" rx="420" ry="300" fill="url(#glow)"/>
  <circle cx="820" cy="418" r="38" fill="#F8E6BE" opacity="0.85"/>

  <!-- distant shoreline -->
  <g fill="#1B2A41" opacity="0.1">
    <path d="M0 432 L120 424 L210 430 L330 420 L470 430 L640 424 L820 431 L1000 423 L1200 430 L1200 442 L0 442 Z"/>
  </g>

  <!-- terminal: silo bank -->
  <g fill="#1B2A41" opacity="0.42">
    <rect x="96" y="248" width="42" height="194" rx="1"/>
    <rect x="144" y="270" width="42" height="172" rx="1"/>
    <rect x="192" y="232" width="42" height="210" rx="1"/>
    <rect x="240" y="278" width="42" height="164" rx="1"/>
    <rect x="288" y="258" width="42" height="184" rx="1"/>
    <rect x="82" y="218" width="262" height="14" rx="1"/>
    <rect x="136" y="180" width="12" height="40"/>
    <rect x="272" y="180" width="12" height="40"/>
  </g>

  <!-- gantry crane -->
  <g fill="none" stroke="#1B2A41" stroke-opacity="0.4" stroke-width="4.5" stroke-linecap="square">
    <path d="M424 442 L424 268 M488 442 L488 268"/>
    <path d="M392 268 L636 268"/>
    <path d="M636 268 L636 318"/>
    <path d="M456 268 L456 228 L392 268"/>
  </g>
  <rect x="618" y="314" width="36" height="20" fill="#1B2A41" fill-opacity="0.4"/>

  <!-- bulk carrier -->
  <g opacity="0.5">
    <path d="M706 404 L706 442 L1042 442 L1068 404 Z" fill="#1B2A41"/>
    <rect x="706" y="360" width="78" height="44" fill="#1B2A41"/>
    <rect x="722" y="336" width="38" height="24" fill="#1B2A41"/>
    <g fill="#1B2A41" opacity="0.85">
      <rect x="812" y="382" width="50" height="22"/>
      <rect x="874" y="382" width="50" height="22"/>
      <rect x="936" y="382" width="50" height="22"/>
      <rect x="843" y="360" width="50" height="20"/>
      <rect x="905" y="360" width="50" height="20"/>
    </g>
    <path d="M730 336 L730 300" stroke="#1B2A41" stroke-width="3"/>
  </g>

  <!-- atmospheric haze across the middle distance -->
  <rect x="0" y="300" width="1200" height="142" fill="url(#haze)"/>

  <!-- water -->
  <rect x="0" y="442" width="1200" height="233" fill="url(#sea)"/>
  <g stroke="#F7F3EC" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <path d="M70 480 L340 480"/>
    <path d="M430 506 L790 506"/>
    <path d="M130 534 L660 534"/>
    <path d="M560 566 L1120 566"/>
    <path d="M90 600 L500 600"/>
    <path d="M690 630 L1150 630"/>
    <path d="M240 656 L820 656"/>
  </g>
  <g stroke="#F8E6BE" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
    <path d="M780 466 L862 466"/>
    <path d="M772 500 L874 500"/>
    <path d="M790 536 L852 536"/>
    <path d="M764 574 L882 574"/>
    <path d="M796 614 L848 614"/>
  </g>

  <!-- quay line -->
  <rect x="0" y="438" width="1200" height="5" fill="#1B2A41" fill-opacity="0.2"/>
</svg>
