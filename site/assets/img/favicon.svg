<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ARMINAK CARAVAN">
  <!-- Direction C, "Seal" — the chosen mark (brand/README.md). Geometry is
       brand/svg/c-mark-colour.svg, with the disc opened from r=47 to r=50 so
       the seal fills the tile: at 16px every pixel of inset is a pixel of the
       mark lost. The dune paths already span the full 0–100 box, so they need
       no adjustment to meet the wider clip. -->
  <defs><clipPath id="seal"><circle cx="50" cy="50" r="50"/></clipPath></defs>
  <circle cx="50" cy="50" r="50" fill="#1B2A41"/>
  <g clip-path="url(#seal)">
    <path d="M 0 71 C 12 71 20 53 37 53 C 52 53 61 63 100 61 L 100 100 L 0 100 Z" fill="#B08D57" opacity="0.45"/>
    <path d="M 0 86 C 20 86 33 71 59 69 C 77 67.6 87 77 100 75 L 100 100 L 0 100 Z" fill="#B08D57"/>
  </g>
  <circle cx="69" cy="29" r="9" fill="#B08D57"/>
</svg>
